<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <title>InfoPol</title>
  <!--
    Single Page App + GitHub Pages: aquesta pàgina rep qualsevol URL
    desconeguda (com /infopol/leyes/codi-penal) i la redirigeix a la
    home preservant la ruta a la query string. Allà, un script a
    index.html descodifica la query i restaura la URL original via
    history.replaceState. Així el routing client-side funciona.
    Tècnica: rafgraph/spa-github-pages.
  -->
  <script type="text/javascript">
    var pathSegmentsToKeep = 1; // /infopol/

    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
