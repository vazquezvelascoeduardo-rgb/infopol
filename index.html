<!doctype html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1628" />
    <meta name="description" content="InfoPol — Consulta ràpida per a agents de policia local" />
    <title>InfoPol</title>
    <!-- Tipografia de les infografies (carregada de forma global perquè
         ara es renderitzen inline al DOM, no dins d'iframes). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Source+Sans+3:wght@300;400;600;700&display=swap"
    />
  </head>
  <body class="bg-white text-slate-900 dark:bg-[#0a1628] dark:text-slate-100">
    <!-- SPA + GitHub Pages: si la URL ve d'un redirect des de 404.html
         amb la ruta encodada a la query (?/leyes/codi-penal/...), ho
         desencodifiquem aquí abans que React Router agafi el control. -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(
            null,
            '',
            l.pathname.slice(0, -1) + decoded + l.hash,
          );
        }
      })(window.location);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
