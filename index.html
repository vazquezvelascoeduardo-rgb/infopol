<!doctype html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content-Security-Policy: capa de defensa contra XSS i injecció
      d'scripts. Permet només recursos del propi domini, Google Fonts
      i la connexió HTTPS/WSS al projecte Supabase.

      Excepcions necessàries:
      - 'unsafe-inline' a style-src: Vite/Tailwind injecten CSS inline
        i les fitxes legals (Codi Penal, LOPSC, etc.) porten <style>.
      - 'unsafe-inline' i 'unsafe-eval' a script-src: les fitxes HTML
        del catàleg SCT i d'altres fitxes legals tenen scripts inline
        per a filtres, modals i expand de files. Sense aquestes flags,
        no funcionarien.

      Defensa restant: la CSP segueix limitant default-src i connect-src,
      bloqueja frames externs (frame-ancestors 'none'), prohibeix
      object-src i manté X-Content-Type-Options nosniff.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://fonts.googleapis.com https://fonts.gstatic.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; manifest-src 'self'"
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0E0E0E" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FAF6EF" media="(prefers-color-scheme: light)" />
    <meta name="description" content="InfoPol — Consulta ràpida de normativa, infografies i operativa per a agents de policia local (Catalunya)." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="InfoPol" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="InfoPol" />
    <meta property="og:title" content="InfoPol — Consulta operativa policia local" />
    <meta property="og:description" content="Normativa, infografies i operativa de butxaca per a agents de policia local (Catalunya)." />
    <meta property="og:url" content="https://infopol.app/" />
    <meta property="og:image" content="https://infopol.app/pwa-512x512.png" />
    <meta property="og:locale" content="ca_ES" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="InfoPol — Consulta operativa policia local" />
    <meta name="twitter:description" content="Normativa, infografies i operativa de butxaca per a agents de policia local (Catalunya)." />
    <meta name="twitter:image" content="https://infopol.app/pwa-512x512.png" />

    <link rel="canonical" href="https://infopol.app/" />
    <title>InfoPol — Consulta operativa policia local</title>
    <!-- Tipografies del rebranding 2026 (Plus Jakarta Sans + JetBrains Mono)
         + Oswald/Source Sans 3 que segueixen usant les infografies del temari. -->
    <!--
      Tipografies de Google Fonts. Notes de seguretat:
      - crossorigin="anonymous": evita enviar credencials cross-origin
        i permet caché correcte (200 en lloc d'opaque) al service worker.
      - referrerpolicy="no-referrer": no enviem el referer (privadesa).
      - SRI no s'aplica perquè Google Fonts genera CSS dinàmicament i el
        hash canviaria amb cada actualització. Per un nivell més alt,
        considera self-hostar les fonts (descarregar woff2 a /public/fonts).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link
      rel="stylesheet"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&family=Manrope:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Oswald:wght@400;600;700&family=Source+Sans+3:wght@300;400;600;700&display=swap"
    />
  </head>
  <body class="bg-paper text-ink">
    <!-- SPA + GitHub Pages: si la URL ve d'un redirect des de 404.html
         amb la ruta encodada a la query (?/leyes/codi-penal/...), ho
         desencodifiquem aquí abans que React Router agafi el control. -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(
            null,
            '',
            l.pathname.slice(0, -1) + decoded + l.hash,
          );
        }
      })(window.location);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
