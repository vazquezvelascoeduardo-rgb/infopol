name: Cerca de notícies diària

on:
  schedule:
    # 20:00 UTC = 22:00 CEST (estiu) / 21:00 CET (hivern)
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no push)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install @anthropic-ai/sdk
        run: npm install --no-save @anthropic-ai/sdk

      - name: Fetch and process news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/fetch-news.mjs

      - name: Commit and push news
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "InfoPol Bot"
          git config user.email "bot@infopol.cat"
          git add server/data/news.json
          if git diff --staged --quiet; then
            echo "No hi ha canvis nous."
          else
            git commit -m "notícies: actualització automàtica $(date -u +%Y-%m-%d)"
            git push origin ${{ github.ref_name }}
          fi
