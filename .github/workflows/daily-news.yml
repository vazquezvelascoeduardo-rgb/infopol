name: Actualització Notícies Diàries

on:
  schedule:
    # 20:00 UTC = 22:00 CEST (estiu) / 21:00 CET (hivern, un cop canvi horari)
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Prova sense guardar (dry run)'
        type: boolean
        default: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install @anthropic-ai/sdk

      - name: Fetch news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/fetch-news.mjs

      - name: Commit and push
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.email "bot@infopol.cat"
          git config user.name "InfoPol News Bot"
          git add src/data/news.json
          if git diff --cached --quiet; then
            echo "Cap canvi detectat, res a fer."
          else
            git commit -m "notícies: actualització automàtica $(date +'%d/%m/%Y %H:%M UTC')"
            git push origin main
          fi
