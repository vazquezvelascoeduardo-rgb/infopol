name: Cerca diària de notícies

on:
  schedule:
    # 20:00 UTC = 22:00 CEST (estiu) / 21:00 CET (hivern)
    - cron: '0 20 * * *'
  workflow_dispatch: {}

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/fetch-news.js

      - name: Commit and push if changed
        run: |
          git config user.name "InfoPol Bot"
          git config user.email "bot@infopol.app"
          git add src/data/news.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: actualització automàtica de notícies $(date -u +%Y-%m-%d)"
            git push origin ${{ github.ref_name }}
          fi
