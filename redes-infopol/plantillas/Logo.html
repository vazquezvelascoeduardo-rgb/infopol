<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>InfoPol — Logo & App Icon</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; }
  body { font-family: 'Manrope', system-ui, sans-serif; background: #f0eee9; color: #13131A; }
  * { box-sizing: border-box; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script src="tokens.jsx" type="text/babel"></script>
<script src="design-canvas.jsx" type="text/babel"></script>

<script type="text/babel">
// ────────────────────────────────────────────────────────────────────
// InfoPol — Logo & App Icon exploration
// 6 lockup variations, 6 app-icon variations, plus real-size showcases.
// Color system: warm off-white bg, near-black ink, terracota "pol" accent,
// cool blue operativa accent — all from existing tokens.jsx.
// ────────────────────────────────────────────────────────────────────

const T = window.TOKENS;
const TERRACOTA = T.cat.academia.solid;   // #FF7A1A
const BLUE      = T.cat.operativa.solid;  // #3B6BF5
const INK       = T.ink;                  // #13131A
const PAPER     = T.bg;                   // #F6F4EF

// ─── Marks ──────────────────────────────────────────────────────────

// 1. Shield-i — escudo geométrico con una "i" formada por línea y punto.
//    Lectura: Información (i) + protección (escudo).
function MarkShieldI({ size = 64, c1 = INK, c2 = TERRACOTA }) {
  const s = size;
  return (
    <svg width={s} height={s} viewBox="0 0 64 64" fill="none">
      <path d="M32 4 L56 12 V32 C56 46 45 56 32 60 C19 56 8 46 8 32 V12 Z"
            fill={c1} />
      {/* dot of "i" */}
      <circle cx="32" cy="22" r="4.2" fill={c2} />
      {/* stem of "i" */}
      <rect x="28.4" y="30" width="7.2" height="20" rx="3.6" fill={c2} />
    </svg>
  );
}

// 2. Badge-Pol — placa policial cuadrada con esquinas concéntricas,
//    estrella minimal en negativo. Más institucional.
function MarkBadge({ size = 64, c1 = INK, c2 = TERRACOTA }) {
  const s = size;
  return (
    <svg width={s} height={s} viewBox="0 0 64 64" fill="none">
      <rect x="6" y="6" width="52" height="52" rx="14" fill={c1} />
      <rect x="12" y="12" width="40" height="40" rx="9" fill="none" stroke={c2} strokeWidth="2" opacity="0.5" />
      {/* 5-point star */}
      <path d="M32 18 L35.6 28.5 L46.6 28.5 L37.7 35 L41.3 45.5 L32 39 L22.7 45.5 L26.3 35 L17.4 28.5 L28.4 28.5 Z"
            fill={c2} />
    </svg>
  );
}

// 3. Monograma IP — "i" + "p" entrelazadas en cuadrado de bordes redondeados.
//    Compacto, tipográfico.
function MarkMonogram({ size = 64, c1 = INK, c2 = TERRACOTA }) {
  const s = size;
  return (
    <svg width={s} height={s} viewBox="0 0 64 64" fill="none">
      <rect x="0" y="0" width="64" height="64" rx="16" fill={c1} />
      {/* i */}
      <circle cx="20" cy="18" r="3.6" fill="#fff" />
      <rect x="16.6" y="25" width="6.8" height="24" rx="3.4" fill="#fff" />
      {/* p */}
      <rect x="32" y="25" width="6.8" height="30" rx="3.4" fill={c2} />
      <path d="M38.8 25 H46 a8 8 0 0 1 0 16 H38.8 Z" fill={c2} />
      <circle cx="44" cy="33" r="3" fill={c1} />
    </svg>
  );
}

// 4. Signal-i — torre/onda de señal formando una "i" en perspectiva.
//    Lectura: Info en directo, transmisión, claridad.
function MarkSignal({ size = 64, c1 = INK, c2 = TERRACOTA }) {
  const s = size;
  return (
    <svg width={s} height={s} viewBox="0 0 64 64" fill="none">
      <circle cx="32" cy="32" r="28" fill={c1} />
      {/* dot */}
      <circle cx="32" cy="20" r="3.6" fill={c2} />
      {/* stem */}
      <rect x="29" y="27" width="6" height="22" rx="3" fill="#fff" />
      {/* concentric arcs around the dot */}
      <path d="M22 18 a14 14 0 0 1 20 0" stroke={c2} strokeWidth="2.2" fill="none" strokeLinecap="round"/>
      <path d="M16 14 a22 22 0 0 1 32 0" stroke={c2} strokeWidth="2.2" fill="none" strokeLinecap="round" opacity="0.5"/>
    </svg>
  );
}

// 5. Stop-Disc — disco con franja diagonal (stop sign abstracto), "i" central.
//    Más juguetón, se asocia a la academia.
function MarkDisc({ size = 64, c1 = TERRACOTA, c2 = INK }) {
  const s = size;
  return (
    <svg width={s} height={s} viewBox="0 0 64 64" fill="none">
      <circle cx="32" cy="32" r="28" fill={c1} />
      {/* diagonal slab */}
      <rect x="6" y="27" width="52" height="10" fill="#fff" transform="rotate(-25 32 32)" />
      {/* i dot */}
      <circle cx="32" cy="16" r="4.2" fill="#fff" />
      {/* i stem */}
      <rect x="28.4" y="40" width="7.2" height="14" rx="3.6" fill="#fff" />
    </svg>
  );
}

// 6. Chevron-Up — par de chevrones apilados (rango/insignia) + punto.
//    Sugiere progreso, ranks, oposiciones.
function MarkChevron({ size = 64, c1 = INK, c2 = TERRACOTA }) {
  const s = size;
  return (
    <svg width={s} height={s} viewBox="0 0 64 64" fill="none">
      <rect x="0" y="0" width="64" height="64" rx="16" fill={c1} />
      <path d="M14 36 L32 18 L50 36" stroke={c2} strokeWidth="6" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
      <path d="M14 50 L32 32 L50 50" stroke="#fff" strokeWidth="6" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

// ─── Wordmark ───────────────────────────────────────────────────────
function Wordmark({ size = 36, color = INK, accent = TERRACOTA, weight = 800 }) {
  return (
    <span style={{
      fontFamily: 'Manrope, system-ui, sans-serif',
      fontWeight: weight, fontSize: size,
      letterSpacing: -size * 0.025,
      color, lineHeight: 1, whiteSpace: 'nowrap',
      display: 'inline-flex', alignItems: 'baseline',
    }}>
      info<span style={{ color: accent }}>pol</span>
    </span>
  );
}

// ─── Lockup (mark + wordmark) ───────────────────────────────────────
function Lockup({ Mark, size = 64, type = 36, gap = 14, color = INK, accent = TERRACOTA, markProps = {} }) {
  return (
    <div style={{ display: 'inline-flex', alignItems: 'center', gap }}>
      <Mark size={size} {...markProps} />
      <Wordmark size={type} color={color} accent={accent} />
    </div>
  );
}

// ─── App icon container (iOS-style squircle) ────────────────────────
function AppIcon({ size = 180, bg, children, radius }) {
  const r = radius != null ? radius : size * 0.22;
  return (
    <div style={{
      width: size, height: size, borderRadius: r,
      background: bg, position: 'relative', overflow: 'hidden',
      display: 'grid', placeItems: 'center',
      boxShadow: '0 1px 0 rgba(255,255,255,0.4) inset, 0 14px 30px rgba(19,19,26,0.18), 0 2px 6px rgba(19,19,26,0.10)',
    }}>
      {children}
    </div>
  );
}

// ─── App icon variants ──────────────────────────────────────────────

// A. Wordmark cropped — "iP" en grande, terracota.
function IconWordmark({ size = 180 }) {
  return (
    <AppIcon size={size} bg="#fff">
      <span style={{
        fontFamily: 'Manrope', fontWeight: 900,
        fontSize: size * 0.62, letterSpacing: -size * 0.02,
        color: INK, lineHeight: 1,
      }}>i<span style={{ color: TERRACOTA }}>P</span></span>
    </AppIcon>
  );
}

// B. Shield-i sobre terracota (full bleed)
function IconShield({ size = 180 }) {
  const inner = size * 0.6;
  return (
    <AppIcon size={size} bg={TERRACOTA}>
      <svg width={inner} height={inner} viewBox="0 0 64 64" fill="none">
        <path d="M32 4 L56 12 V32 C56 46 45 56 32 60 C19 56 8 46 8 32 V12 Z" fill="#fff"/>
        <circle cx="32" cy="22" r="4.2" fill={TERRACOTA}/>
        <rect x="28.4" y="30" width="7.2" height="20" rx="3.6" fill={TERRACOTA}/>
      </svg>
    </AppIcon>
  );
}

// C. Negative shield over ink, terracota mark
function IconShieldDark({ size = 180 }) {
  const inner = size * 0.6;
  return (
    <AppIcon size={size} bg={INK}>
      <svg width={inner} height={inner} viewBox="0 0 64 64" fill="none">
        <path d="M32 4 L56 12 V32 C56 46 45 56 32 60 C19 56 8 46 8 32 V12 Z" fill={TERRACOTA}/>
        <circle cx="32" cy="22" r="4.2" fill="#fff"/>
        <rect x="28.4" y="30" width="7.2" height="20" rx="3.6" fill="#fff"/>
      </svg>
    </AppIcon>
  );
}

// D. Chevron stack on ink — gamified rank
function IconChevron({ size = 180 }) {
  const inner = size * 0.6;
  return (
    <AppIcon size={size} bg={INK}>
      <svg width={inner} height={inner} viewBox="0 0 64 64" fill="none">
        <path d="M12 36 L32 16 L52 36" stroke={TERRACOTA} strokeWidth="7" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
        <path d="M12 52 L32 32 L52 52" stroke="#fff" strokeWidth="7" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
      </svg>
    </AppIcon>
  );
}

// E. Signal-i over terracota
function IconSignal({ size = 180 }) {
  const inner = size * 0.62;
  return (
    <AppIcon size={size} bg={TERRACOTA}>
      <svg width={inner} height={inner} viewBox="0 0 64 64" fill="none">
        <circle cx="32" cy="22" r="5" fill="#fff"/>
        <rect x="28.6" y="30" width="6.8" height="22" rx="3.4" fill="#fff"/>
        <path d="M22 18 a14 14 0 0 1 20 0" stroke="#fff" strokeWidth="2.6" fill="none" strokeLinecap="round"/>
        <path d="M14 12 a24 24 0 0 1 36 0" stroke="#fff" strokeWidth="2.6" fill="none" strokeLinecap="round" opacity="0.6"/>
      </svg>
    </AppIcon>
  );
}

// F. Gradient warm — terracota → blue, mono mark blanca
function IconGradient({ size = 180 }) {
  const inner = size * 0.58;
  const gid = 'g-' + Math.random().toString(36).slice(2,8);
  return (
    <AppIcon size={size} bg={`linear-gradient(135deg, ${TERRACOTA} 0%, #E04F5F 55%, ${BLUE} 100%)`}>
      <svg width={inner} height={inner} viewBox="0 0 64 64" fill="none">
        <path d="M32 4 L56 12 V32 C56 46 45 56 32 60 C19 56 8 46 8 32 V12 Z" fill="#fff"/>
        <circle cx="32" cy="22" r="4.2" fill={TERRACOTA}/>
        <rect x="28.4" y="30" width="7.2" height="20" rx="3.6" fill={TERRACOTA}/>
      </svg>
    </AppIcon>
  );
}

// ─── Showcase frame helpers ─────────────────────────────────────────
function Caption({ tag, title, note }) {
  return (
    <div style={{ marginBottom: 14 }}>
      <div className="mono" style={{
        fontSize: 10, letterSpacing: 1.4, textTransform: 'uppercase',
        color: 'rgba(60,50,40,0.55)', fontWeight: 600, marginBottom: 6,
      }}>{tag}</div>
      <div style={{ fontWeight: 800, fontSize: 16, color: INK, letterSpacing: -0.2 }}>{title}</div>
      {note && <div style={{ fontSize: 12, color: 'rgba(60,50,40,0.65)', marginTop: 3 }}>{note}</div>}
    </div>
  );
}

function Swatch({ children, bg = '#fff', pad = 36, h, style }) {
  return (
    <div style={{
      background: bg,
      borderRadius: 16,
      padding: pad,
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      minHeight: h,
      border: bg === '#fff' ? '1px solid rgba(19,19,26,0.06)' : 'none',
      ...style,
    }}>{children}</div>
  );
}

// ─── Logo cards ─────────────────────────────────────────────────────
const LOGO_VARIANTS = [
  { id: 'shield-i',  Mark: MarkShieldI,  tag: 'A · ESCUDO-I', title: 'Shield · "i" interior',
    note: 'Información protegida. Lectura limpia, encaja con la línea operativa.' },
  { id: 'badge',     Mark: MarkBadge,    tag: 'B · BADGE',    title: 'Placa policial',
    note: 'Más institucional, eco a oposiciones. Estrella minimal en negativo.' },
  { id: 'monogram',  Mark: MarkMonogram, tag: 'C · MONOGRAMA','title': 'Monograma iP',
    note: 'Tipográfico, escala bien a favicon. Punto + asta + lazo.' },
  { id: 'signal',    Mark: MarkSignal,   tag: 'D · SEÑAL',    title: 'Signal · "i" en directo',
    note: 'Idea de información en transmisión. Más cercano a "info" que a "pol".' },
  { id: 'disc',      Mark: MarkDisc,     tag: 'E · DISCO',    title: 'Stop-disc terracota',
    note: 'Vibe academia gamificada. Pop visual, llama la atención.' },
  { id: 'chevron',   Mark: MarkChevron,  tag: 'F · GALONES',  title: 'Galones / rangos',
    note: 'Sugiere progresión, ascensos. Refuerza el lado oposiciones.' },
];

function LogoCard({ variant }) {
  const { Mark, tag, title, note } = variant;
  return (
    <div>
      <Caption tag={tag} title={title} note={note} />
      <Swatch bg="#fff" h={150}>
        <Lockup Mark={Mark} size={64} type={40} />
      </Swatch>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, marginTop: 10 }}>
        <Swatch bg={INK} pad={24} h={88}>
          <Lockup Mark={Mark} size={40} type={24}
                  color="#fff" accent={TERRACOTA}
                  markProps={{ c1: '#fff', c2: TERRACOTA }} />
        </Swatch>
        <Swatch bg={TERRACOTA} pad={24} h={88}>
          <Lockup Mark={Mark} size={40} type={24}
                  color="#fff" accent="#fff"
                  markProps={{ c1: '#fff', c2: TERRACOTA }} />
        </Swatch>
      </div>
    </div>
  );
}

// ─── Icon cards ─────────────────────────────────────────────────────
const ICON_VARIANTS = [
  { id: 'wordmark', C: IconWordmark, tag: 'A · WORDMARK',  title: 'iP · paper',
    note: 'Mínimo. Funciona en notch / cabecera. Muy reconocible en lista.' },
  { id: 'shield',   C: IconShield,   tag: 'B · ESCUDO',    title: 'Shield · terracota',
    note: 'Pop directo en homescreen. Color principal de la marca.' },
  { id: 'shielddark', C: IconShieldDark, tag: 'C · ESCUDO DARK', title: 'Shield · noche',
    note: 'Más serio, modo "operativa". Buena legibilidad en wallpaper claro.' },
  { id: 'chevron',  C: IconChevron,  tag: 'D · GALONES',   title: 'Chevrons · ink',
    note: 'Vibe academia + rank. Resalta entre apps blancas.' },
  { id: 'signal',   C: IconSignal,   tag: 'E · SEÑAL',     title: 'Signal · terracota',
    note: 'Ruta cercana al escudo, más ligera. Gana a tamaño favicon.' },
  { id: 'gradient', C: IconGradient, tag: 'F · DEGRADADO', title: 'Warm gradient',
    note: 'Más expresivo, contemporáneo. Riesgo: choca con interior limpio.' },
];

function IconCard({ variant }) {
  const { C: Comp, tag, title, note } = variant;
  return (
    <div>
      <Caption tag={tag} title={title} note={note} />
      <Swatch bg="#e8e5dd" h={250}>
        <Comp size={180} />
      </Swatch>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-around',
                    background: '#fff', borderRadius: 12, padding: '14px 18px', marginTop: 10,
                    border: '1px solid rgba(19,19,26,0.06)' }}>
        <Comp size={120} />
        <Comp size={64} />
        <Comp size={40} />
        <Comp size={24} />
      </div>
      <div className="mono" style={{ fontSize: 9, letterSpacing: 1.1, textTransform: 'uppercase',
            color: 'rgba(60,50,40,0.5)', fontWeight: 600, marginTop: 6, textAlign: 'center' }}>
        180 · 120 · 64 · 40 · 24 px
      </div>
    </div>
  );
}

// ─── App: Design canvas with all sections ───────────────────────────
const { DesignCanvas, DCSection, DCArtboard } = window;

function App() {
  return (
    <DesignCanvas>
      {/* ── SECTION 1 — LOGO LOCKUPS ───────────────────────────── */}
      <DCSection id="logos" title="InfoPol · Logo"
                 subtitle="6 direcciones de marca. Cada tarjeta muestra el lockup en blanco, ink y terracota.">
        {LOGO_VARIANTS.map(v => (
          <DCArtboard key={v.id} id={v.id} label={v.title} width={420} height={520}>
            <div style={{ background: PAPER, padding: 28, height: '100%', boxSizing: 'border-box' }}>
              <LogoCard variant={v} />
            </div>
          </DCArtboard>
        ))}
      </DCSection>

      {/* ── SECTION 2 — APP ICONS ──────────────────────────────── */}
      <DCSection id="icons" title="InfoPol · App icon"
                 subtitle="6 propuestas de icono. Cada una muestra tamaño grande sobre wallpaper, y rampa 120 / 64 / 40 / 24 px.">
        {ICON_VARIANTS.map(v => (
          <DCArtboard key={v.id} id={v.id} label={v.title} width={420} height={520}>
            <div style={{ background: PAPER, padding: 28, height: '100%', boxSizing: 'border-box' }}>
              <IconCard variant={v} />
            </div>
          </DCArtboard>
        ))}
      </DCSection>

      {/* ── SECTION 3 — IN-CONTEXT ─────────────────────────────── */}
      <DCSection id="context" title="En contexto"
                 subtitle="Recomendados (Shield-i + Icon Shield) en uso real: cabecera de app, splash y springboard.">

        {/* Header */}
        <DCArtboard id="header" label="Cabecera de app" width={520} height={260}>
          <div style={{ height: '100%', background: '#fff', padding: 28, boxSizing: 'border-box',
                        display: 'flex', flexDirection: 'column', gap: 18 }}>
            <Caption tag="01 · TOPBAR" title="Cabecera clara" note="Lockup horizontal, 28px de altura tipográfica." />
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                          padding: '14px 18px', borderRadius: 14,
                          border: '1px solid rgba(19,19,26,0.08)' }}>
              <Lockup Mark={MarkShieldI} size={32} type={20} gap={10} />
              <span className="mono" style={{ fontSize: 11, color: 'rgba(60,50,40,0.6)' }}>cercar · perfil</span>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                          padding: '14px 18px', borderRadius: 14, background: INK, color: '#fff' }}>
              <Lockup Mark={MarkShieldI} size={32} type={20} gap={10}
                      color="#fff" accent={TERRACOTA}
                      markProps={{ c1: '#fff', c2: TERRACOTA }} />
              <span className="mono" style={{ fontSize: 11, color: 'rgba(255,255,255,0.6)' }}>operativa</span>
            </div>
          </div>
        </DCArtboard>

        {/* Splash */}
        <DCArtboard id="splash" label="Splash · arranque" width={300} height={580}>
          <div style={{ height: '100%', background: TERRACOTA, position: 'relative',
                        display: 'flex', flexDirection: 'column', alignItems: 'center',
                        justifyContent: 'center', gap: 18, color: '#fff' }}>
            <svg width="92" height="92" viewBox="0 0 64 64" fill="none">
              <path d="M32 4 L56 12 V32 C56 46 45 56 32 60 C19 56 8 46 8 32 V12 Z" fill="#fff"/>
              <circle cx="32" cy="22" r="4.2" fill={TERRACOTA}/>
              <rect x="28.4" y="30" width="7.2" height="20" rx="3.6" fill={TERRACOTA}/>
            </svg>
            <Wordmark size={42} color="#fff" accent="#fff" />
            <div className="mono" style={{ position: 'absolute', bottom: 28, fontSize: 10,
                  letterSpacing: 1.4, textTransform: 'uppercase', opacity: 0.85 }}>
              Mossos · Policia local · GC
            </div>
          </div>
        </DCArtboard>

        {/* Springboard */}
        <DCArtboard id="springboard" label="Springboard · iOS" width={340} height={580}>
          <div style={{ height: '100%', padding: 22, boxSizing: 'border-box',
                        background: 'linear-gradient(180deg, #eadfd1 0%, #d6c4ad 100%)',
                        display: 'flex', flexDirection: 'column', gap: 20 }}>
            <div className="mono" style={{ fontSize: 10, letterSpacing: 1.4, textTransform: 'uppercase',
                  color: 'rgba(40,30,20,0.55)', fontWeight: 600 }}>iPhone · springboard</div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 16 }}>
              {/* row 1 — neighbors */}
              {['#34c759','#007aff','#ff3b30','#ffcc00'].map((c,i)=>(
                <div key={'n'+i} style={{ aspectRatio: '1', borderRadius: 14, background: c, opacity: 0.92 }}/>
              ))}
              {/* row 2 — InfoPol prominent */}
              <div style={{ display: 'flex', justifyContent: 'center' }}>
                <IconShield size={62} />
              </div>
              {['#5856d6','#ff9500','#af52de'].map((c,i)=>(
                <div key={'m'+i} style={{ aspectRatio: '1', borderRadius: 14, background: c, opacity: 0.92 }}/>
              ))}
              {/* row 3 */}
              {['#5ac8fa','#ff2d55','#a2845e','#8e8e93'].map((c,i)=>(
                <div key={'b'+i} style={{ aspectRatio: '1', borderRadius: 14, background: c, opacity: 0.92 }}/>
              ))}
            </div>
            <div style={{ marginTop: 'auto', textAlign: 'center', fontSize: 11,
                          fontWeight: 700, color: 'rgba(40,30,20,0.85)' }}>
              InfoPol
            </div>
          </div>
        </DCArtboard>
      </DCSection>

      {/* ── SECTION 4 — CLEARSPACE & TIPOGRAFÍA ──────────────── */}
      <DCSection id="specs" title="Especificaciones"
                 subtitle="Reservas mínimas, tamaño favicon y construcción del wordmark.">

        <DCArtboard id="clear" label="Reserva mínima" width={420} height={300}>
          <div style={{ background: '#fff', padding: 32, height: '100%', boxSizing: 'border-box' }}>
            <Caption tag="01 · CLEARSPACE" title="x = altura del punto de la i" />
            <div style={{ position: 'relative', display: 'inline-block',
                          padding: 16, border: '1px dashed rgba(19,19,26,0.25)' }}>
              <Lockup Mark={MarkShieldI} size={56} type={34} />
              <span className="mono" style={{ position:'absolute', top:-6, left:'50%',
                    transform:'translate(-50%,-50%)', background:'#fff', padding:'0 6px',
                    fontSize: 10, color:'rgba(60,50,40,0.6)' }}>x</span>
              <span className="mono" style={{ position:'absolute', bottom:-6, left:'50%',
                    transform:'translate(-50%,50%)', background:'#fff', padding:'0 6px',
                    fontSize: 10, color:'rgba(60,50,40,0.6)' }}>x</span>
            </div>
          </div>
        </DCArtboard>

        <DCArtboard id="favicon" label="Tamaños mínimos" width={420} height={300}>
          <div style={{ background: '#fff', padding: 28, height: '100%', boxSizing: 'border-box' }}>
            <Caption tag="02 · ESCALA" title="Marca → mínimo 16 px · Lockup → mínimo 22 px" />
            <div style={{ display: 'flex', alignItems: 'flex-end', gap: 24, marginTop: 18 }}>
              <div style={{ textAlign: 'center' }}>
                <MarkShieldI size={64}/>
                <div className="mono" style={{ fontSize: 9, color:'rgba(60,50,40,0.55)', marginTop: 6 }}>64</div>
              </div>
              <div style={{ textAlign: 'center' }}>
                <MarkShieldI size={32}/>
                <div className="mono" style={{ fontSize: 9, color:'rgba(60,50,40,0.55)', marginTop: 6 }}>32</div>
              </div>
              <div style={{ textAlign: 'center' }}>
                <MarkShieldI size={20}/>
                <div className="mono" style={{ fontSize: 9, color:'rgba(60,50,40,0.55)', marginTop: 6 }}>20</div>
              </div>
              <div style={{ textAlign: 'center' }}>
                <MarkShieldI size={16}/>
                <div className="mono" style={{ fontSize: 9, color:'rgba(60,50,40,0.55)', marginTop: 6 }}>16</div>
              </div>
            </div>
            <div style={{ height: 1, background: 'rgba(19,19,26,0.08)', margin: '20px 0' }}/>
            <div style={{ display: 'flex', alignItems: 'center', gap: 18 }}>
              <Lockup Mark={MarkShieldI} size={36} type={22} />
              <Lockup Mark={MarkShieldI} size={28} type={18} />
              <Lockup Mark={MarkShieldI} size={22} type={14} />
            </div>
          </div>
        </DCArtboard>

        <DCArtboard id="wordmark" label="Wordmark · construcción" width={520} height={300}>
          <div style={{ background: '#fff', padding: 28, height: '100%', boxSizing: 'border-box' }}>
            <Caption tag="03 · TIPOGRAFÍA"
                     title="Manrope ExtraBold · tracking −2.5%"
                     note='"info" en ink #13131A · "pol" en terracota #FF7A1A' />
            <div style={{ display: 'flex', flexDirection: 'column', gap: 12, marginTop: 12 }}>
              <Wordmark size={64} />
              <Wordmark size={40} />
              <Wordmark size={24} />
            </div>
          </div>
        </DCArtboard>

        <DCArtboard id="palette" label="Paleta de marca" width={420} height={300}>
          <div style={{ background: '#fff', padding: 28, height: '100%', boxSizing: 'border-box' }}>
            <Caption tag="04 · COLOR" title="Núcleo + acentos" />
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 10, marginTop: 6 }}>
              {[
                { bg: TERRACOTA, n: 'Terracota', h: '#FF7A1A', white: true },
                { bg: INK,       n: 'Ink',       h: '#13131A', white: true },
                { bg: BLUE,      n: 'Operativa', h: '#3B6BF5', white: true },
                { bg: PAPER,     n: 'Paper',     h: '#F6F4EF', white: false },
              ].map(s => (
                <div key={s.n} style={{ background: s.bg, color: s.white ? '#fff' : INK,
                      borderRadius: 10, padding: '14px 10px', minHeight: 80,
                      display: 'flex', flexDirection: 'column', justifyContent: 'space-between',
                      border: s.white ? 'none' : '1px solid rgba(19,19,26,0.1)' }}>
                  <div style={{ fontWeight: 800, fontSize: 12 }}>{s.n}</div>
                  <div className="mono" style={{ fontSize: 10, opacity: 0.85 }}>{s.h}</div>
                </div>
              ))}
            </div>
          </div>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
